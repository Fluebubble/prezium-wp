# Локальная среда для разработки. Пароли ниже только для вашего компьютера.
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp_local_pw
      MARIADB_ROOT_PASSWORD: root_local_pw
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_local_pw
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wordpress_data:/var/www/html
      # Тема лежит в вашей папке, поэтому правки видны сразу
      - ./wp-content/themes/prezium:/var/www/html/wp-content/themes/prezium

volumes:
  db_data:
  wordpress_data:
